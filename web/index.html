<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podcast Reader</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Podcast Reader">
<meta name="theme-color" content="#f3efe6">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
  :root{
    color-scheme:light;
    --bg:#f3efe6; --surface:#fffdf7; --surface-2:#ebe5d8; --ink:#171815;
    --muted:#747267; --line:#d9d2c4; --accent:#f05d45; --accent-ink:#8f2417;
    --mark:#fff09c; --cur:#ffe7dc; --night:#1c211f; --night-2:#29302c;
    --ok:#34785b; --danger:#b64038; --shadow:0 18px 50px rgba(49,42,31,.10);
    --font-ui:"Avenir Next","PingFang SC","Helvetica Neue",sans-serif;
    --font-read:Charter,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){
    :root{color-scheme:dark;--bg:#151916;--surface:#1d221f;--surface-2:#282e2a;--ink:#f2eee5;
      --muted:#aaa69b;--line:#3c433f;--accent:#ff745d;--accent-ink:#ffd8cf;--mark:#635a20;
      --cur:#3b2925;--night:#0d100f;--night-2:#252b28;--shadow:0 22px 60px rgba(0,0,0,.34)}
  }
  *{box-sizing:border-box}
  html{background:var(--bg);scroll-behavior:smooth}
  body{margin:0;min-height:100vh;background:
    radial-gradient(circle at 92% -5%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 30rem),
    linear-gradient(180deg,color-mix(in srgb,var(--surface) 48%,var(--bg)),var(--bg) 24rem);
    background-color:var(--bg);color:var(--ink);font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
  body.reading #url,body.reading #go{display:none}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:2px}
  [hidden]{display:none!important}

  /* App shell */
  .topbar{position:sticky;top:0;z-index:35;height:68px;border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent);
    background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%)}
  .topbar-inner{height:100%;max-width:1160px;margin:auto;padding:0 24px;display:flex;align-items:center;gap:13px}
  #brandHome{display:flex;align-items:center;gap:11px;background:none;border:0;padding:0;text-align:left}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:var(--night);color:#fff;display:grid;place-items:center;
    font:800 11px/1 var(--font-ui);letter-spacing:.08em;box-shadow:inset 0 0 0 1px #ffffff20}
  .brand-copy{display:grid;line-height:1.05}.brand-copy b{font-size:14px;letter-spacing:.02em}.brand-copy small{font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:.12em;text-transform:uppercase}
  #back{display:none;width:36px;height:36px;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:18px;place-items:center}
  .topbar-state{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
  .status{max-width:min(38vw,320px);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #ver{font-size:10px;color:var(--muted);opacity:.62;border:1px solid var(--line);border-radius:99px;padding:2px 7px}
  .app-shell{min-height:calc(100vh - 68px)}
  .app-main{min-width:0}
  .wrap{max-width:900px;margin:0 auto;padding:34px 28px 55vh}

  /* Fixed app navigation: bottom tabs on phone, rail on desktop */
  #appNav{position:fixed;left:0;right:0;bottom:0;z-index:45;height:calc(66px + var(--safe-bottom));padding:5px 12px var(--safe-bottom);
    display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);
    background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%)}
  .nav-item{border:0;background:none;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;color:var(--muted);font-size:10px;letter-spacing:.02em;position:relative}
  .nav-item svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nav-item.active{color:var(--ink);font-weight:650}
  .nav-item.active::before{content:"";position:absolute;top:1px;width:22px;height:3px;border-radius:9px;background:var(--accent)}
  #vocabCount{display:inline;font-size:9px}.nav-label{white-space:nowrap}

  /* Home */
  #homeHero{max-width:1080px;margin:0 auto;padding:38px 28px 0}
  .hero-card{position:relative;overflow:hidden;min-height:252px;border-radius:30px;padding:36px 38px;background:var(--night);color:#f9f4e9;box-shadow:var(--shadow)}
  .hero-card::before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;right:-110px;top:-170px;
    border:64px solid color-mix(in srgb,var(--accent) 82%,transparent);opacity:.9}
  .hero-card::after{content:"READ / LISTEN / KEEP";position:absolute;right:-47px;bottom:38px;transform:rotate(-90deg);
    font-size:9px;letter-spacing:.28em;color:#ffffff66}
  .eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .hero-card h2{position:relative;z-index:1;max-width:650px;margin:12px 0 9px;font:600 clamp(29px,4.4vw,48px)/1.08 var(--font-read);letter-spacing:-.025em}
  .hero-card p{position:relative;z-index:1;margin:0;max-width:560px;color:#d8d2c8;font-size:13px;line-height:1.65}
  .import-box{position:relative;z-index:2;margin-top:28px;display:flex;gap:8px;max-width:700px;padding:7px;background:#ffffff14;border:1px solid #ffffff25;border-radius:16px}
  #url{flex:1;min-width:0;border:0;border-radius:11px;background:#fff;color:#181a18;padding:12px 14px;font-size:14px;box-shadow:inset 0 0 0 1px #0000000d}
  #url::placeholder{color:#898981}
  #go{border:0;border-radius:11px;padding:0 20px;background:var(--accent);color:#fff;font-weight:700;white-space:nowrap;transition:transform .16s,background .16s}
  #go:hover{background:#ff7059;transform:translateY(-1px)}
  .screen-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:0 0 18px}
  .screen-heading h2{margin:0;font:600 27px/1.1 var(--font-read);letter-spacing:-.02em}
  .screen-heading p{margin:6px 0 0;color:var(--muted);font-size:12px}
  .heading-count{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  ul.eps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
  ul.eps li{position:relative;min-width:0;min-height:132px;background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:14px;cursor:pointer;display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:14px;align-items:center;
    box-shadow:0 7px 24px rgba(48,39,27,.045);transition:transform .2s,border-color .2s,box-shadow .2s}
  ul.eps li:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 60%,var(--line));box-shadow:var(--shadow)}
  .episode-cover{width:84px;aspect-ratio:1;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:var(--night);color:#fff;
    font:700 11px/1 var(--font-ui);letter-spacing:.12em;position:relative}
  .episode-cover::after{content:"";position:absolute;width:46px;height:46px;border:12px solid var(--accent);border-radius:50%;right:-17px;bottom:-17px}
  .episode-cover img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
  .episode-copy{min-width:0}.t{font-weight:650;font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .m{font-size:11.5px;line-height:1.45;color:var(--muted);margin-top:6px}
  .badge{display:inline-flex;align-items:center;font-size:10px;padding:4px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .badge.ready{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line));background:color-mix(in srgb,var(--ok) 7%,transparent)}
  .badge.failed{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line));background:color-mix(in srgb,var(--danger) 7%,transparent)}
  .episode-open{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:16px}
  .empty{color:var(--muted);text-align:center;padding:64px 20px;font-size:13px;line-height:1.7;border:1px dashed var(--line);border-radius:20px;background:color-mix(in srgb,var(--surface) 58%,transparent)}

  /* Reader */
  #reader{max-width:780px;margin:0 auto}
  .reader-head{margin:3px 0 18px;padding:0 2px}
  h2.ep{font:600 clamp(27px,5vw,42px)/1.12 var(--font-read);letter-spacing:-.025em;margin:9px 0 8px}
  #epMeta{display:block;color:var(--muted);font-size:12px;line-height:1.5}
  .toolbar{position:sticky;top:79px;z-index:20;margin:0 -12px 28px;padding:10px 12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
    border:1px solid color-mix(in srgb,var(--line) 82%,transparent);border-radius:18px;background:color-mix(in srgb,var(--surface) 88%,transparent);
    backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:0 8px 30px rgba(45,38,28,.07);font-size:12px;color:var(--muted)}
  .toolbar button,.toolbar label{min-height:36px;border:1px solid var(--line);border-radius:11px;background:var(--surface);display:flex;align-items:center;gap:6px;padding:7px 10px;white-space:nowrap}
  .toolbar button{color:var(--ink)}.toolbar label{cursor:pointer}.toolbar input[type="checkbox"]{accent-color:var(--accent)}
  .toolbar input[type="range"]{accent-color:var(--accent);width:82px}.toolbar .grow{flex:1}.toolbar #epMeta{display:none}
  #playBtn{background:var(--night);color:#fff;border-color:var(--night)}
  #locateBtn.following{background:var(--accent);border-color:var(--accent);color:#fff}
  #locateBtn.attention{border-color:var(--accent);color:var(--accent)}
  article{font-family:var(--font-read);font-size:var(--fs,20px);line-height:1.88;letter-spacing:.002em;background:var(--surface);
    border:1px solid var(--line);border-radius:26px;padding:clamp(26px,6vw,58px);box-shadow:0 20px 55px rgba(50,42,29,.055)}
  article p{margin:0 0 1.52em}article p:last-child{margin-bottom:0}
  article .s{cursor:pointer;border-radius:5px;padding:2px 1px;transition:background .14s,box-shadow .14s}
  article .s:hover{background:color-mix(in srgb,var(--cur) 70%,transparent)}
  article .s.cur{background:var(--cur);box-shadow:inset 4px 0 0 var(--accent);padding-left:7px}
  article .s.cursor{box-shadow:inset 3px 0 0 var(--line)}
  article .w{cursor:pointer;border-radius:3px;padding:0 1px}article .w:hover{background:var(--mark)}
  article .w.marked{background:linear-gradient(transparent 53%,var(--mark) 53%);box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--accent) 70%,transparent)}
  article .zh{display:none;font-family:var(--font-ui);font-size:.66em;line-height:1.65;color:var(--muted);margin-top:.12em;pointer-events:none}
  body.show-zh article .zh{display:block}body.show-zh article{line-height:1.72}
  body.show-zh article .s{display:inline-block;width:100%;margin-bottom:.6em;vertical-align:top}

  /* Vocabulary */
  #vocab{display:none}.vg{margin:0 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 20px}
  .vg-h{display:flex;gap:10px;align-items:center;margin:0 0 5px;padding-bottom:13px;border-bottom:1px solid var(--line)}
  .vg-h .vt{font:600 17px/1.35 var(--font-read);flex:1}.vg-h .vc{font-size:10px;color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.08em}
  .vg-h .vgo{font-size:11px;color:var(--accent-ink);background:var(--cur);border:0;border-radius:99px;padding:7px 10px;white-space:nowrap}
  .vg ul{list-style:none;padding:0;margin:0}.vitem{display:flex;gap:12px;align-items:flex-start;padding:15px 2px;border-bottom:1px solid var(--line)}
  .vitem:last-child{border-bottom:0;padding-bottom:2px}.vmain{flex:1;cursor:pointer;min-width:0}.vw{font:600 20px/1.2 var(--font-read)}
  .vmeta{font-size:10px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}.vs{font:14px/1.55 var(--font-read);color:var(--muted);margin-top:8px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.vs .vw{font-size:inherit;background:var(--mark)}
  .vd{font-size:11px;color:var(--accent-ink);margin-top:6px}.vj{text-decoration:underline;text-underline-offset:2px}.vx{flex:0 0 auto;width:34px;height:34px;border:0;border-radius:50%;background:var(--surface-2);color:var(--muted)}
  .vx:hover{color:var(--danger);background:var(--cur)}

  /* Definition card */
  dialog{border:1px solid var(--line);border-radius:24px;background:var(--surface);color:var(--ink);max-width:500px;width:min(92vw,500px);padding:25px;font-size:14px;line-height:1.65;box-shadow:0 30px 100px #0005}
  dialog::backdrop{background:#0d100fb8;backdrop-filter:blur(5px)}dialog h3{margin:0 0 15px;font:600 31px/1.1 var(--font-read)}
  dialog .field{margin:14px 0}dialog .label{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent-ink);font-weight:700}
  dialog .val{margin-top:3px;font-size:16px}dialog .ipa{font:17px var(--font-read)}dialog .roots{background:var(--surface-2);border-radius:14px;padding:12px 14px;margin:12px 0}
  dialog ul{margin:6px 0;padding-left:20px}dialog menu{display:flex;gap:8px;justify-content:flex-end;margin:20px 0 0;padding:0}
  dialog menu button{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:11px}#pMark{background:var(--night);color:#fff;border-color:var(--night)}

  /* Persistent player: floats above app navigation */
  #bar{position:fixed;left:12px;right:12px;bottom:calc(72px + var(--safe-bottom));z-index:44;display:none;max-width:680px;margin:auto;overflow:hidden;
    border:1px solid #ffffff1c;border-radius:18px;background:color-mix(in srgb,var(--night) 94%,transparent);color:#f8f3e9;box-shadow:0 18px 48px #0005;cursor:pointer;
    backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);animation:playerIn .28s ease-out}
  #bar.on{display:block}@keyframes playerIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
  #barTrack{height:3px;background:#ffffff1c}#barFill{height:3px;background:var(--accent);width:0;transition:width .2s linear;position:relative;z-index:1;margin-bottom:-3px}
  #barInner{display:flex;align-items:center;gap:11px;padding:10px 11px}#barCover{width:44px;height:44px;border-radius:12px;flex:0 0 auto;background:var(--night-2);display:grid;place-items:center;overflow:hidden}
  #barCover img,#fullArt img{width:100%;height:100%;object-fit:cover;display:block}#barText{flex:1;min-width:0}#barTitle{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #barSub{font-size:10.5px;color:#b8b7b0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}#bar button{width:38px;height:38px;padding:0;border-radius:50%;border:1px solid #ffffff26;background:#ffffff10;color:#fff;font-size:16px}

  /* Full player */
  #full{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;background:
    radial-gradient(circle at 50% 22%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 35%),var(--night);
    color:#f8f3e9;padding:calc(14px + env(safe-area-inset-top,0px)) 24px calc(24px + var(--safe-bottom))}
  #full.on{display:flex;animation:fullIn .3s cubic-bezier(.2,.8,.2,1)}@keyframes fullIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  #fullTop{display:flex;align-items:center;gap:12px;font-size:11px;color:#b8b7b0;letter-spacing:.08em;text-transform:uppercase;max-width:520px;width:100%;margin:0 auto}
  #fullTop button{font-size:16px;padding:9px 12px;border:1px solid #ffffff1c;border-radius:99px;background:#ffffff0e;color:#fff}
  #fullArt{width:min(72vw,370px);max-height:45vh;aspect-ratio:1;border-radius:28px;margin:auto auto 0;flex:0 1 auto;background:var(--night-2);display:grid;place-items:center;font-size:62px;box-shadow:0 30px 80px #0008;overflow:hidden;position:relative}
  #fullArt::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px #ffffff1e;pointer-events:none}
  #fullTitle,#fullSub,#fullSpacer,#fullTimes,#fullBar,#fullCtl,#fullNote{max-width:520px;width:100%;margin-left:auto;margin-right:auto}
  #fullTitle{font:600 24px/1.25 var(--font-read);letter-spacing:-.015em;margin-top:27px;max-height:2.5em;overflow:hidden}#fullSub{font-size:12px;color:#aaa9a2;margin-top:7px}
  #fullSpacer{flex:1 1 auto;min-height:18px;max-height:90px}#fullTimes{display:flex;justify-content:space-between;font-size:10px;color:#aaa9a2;font-variant-numeric:tabular-nums}
  #fullBar{height:5px;background:#ffffff22;border-radius:99px;margin-top:9px;position:relative;cursor:pointer}#fullBarFill{height:5px;background:var(--accent);border-radius:99px;width:0}
  #fullBarKnob{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;background:#fff;border:4px solid var(--accent);transform:translate(-50%,-50%);left:0}
  #fullCtl{display:flex;align-items:center;justify-content:space-around;gap:6px;margin-top:24px}#fullCtl button{border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 10px}
  #fullCtl .big{font-size:29px}#fullCtl .lbl{font-size:9px;color:#aaa9a2;text-transform:uppercase;letter-spacing:.08em}#fullPlay{width:68px;height:68px;border-radius:50%!important;background:var(--accent)!important;font-size:24px!important;display:grid!important;place-items:center!important}
  #fullNote{font-size:10px;color:#777d79;text-align:center;margin-top:auto;padding-top:15px}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}a{color:var(--accent-ink)}

  @media (min-width:980px){
    .topbar-inner{padding-left:112px}.app-main{padding-left:96px}
    #appNav{top:84px;bottom:auto;left:18px;right:auto;width:64px;height:auto;padding:8px 6px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
    .nav-item{height:58px;flex:0 0 auto}.nav-item.active::before{left:-7px;top:18px;width:3px;height:22px}.nav-item svg{width:21px;height:21px}
    #bar{bottom:20px;left:108px}.wrap{padding-bottom:48vh}
  }
  @media (max-width:760px){
    .topbar{height:60px}.topbar-inner{padding:0 14px;gap:9px}.brand-mark{width:31px;height:31px;border-radius:9px}.brand-copy b{font-size:13px}.brand-copy small{display:none}
    .status{font-size:10.5px;max-width:28vw}#ver{display:none}.app-shell{min-height:calc(100vh - 60px)}
    #homeHero{padding:16px 12px 0}.hero-card{min-height:0;border-radius:23px;padding:25px 20px 22px}.hero-card::before{width:210px;height:210px;right:-90px;top:-115px;border-width:42px}.hero-card::after{display:none}
    .hero-card h2{font-size:30px;max-width:290px}.hero-card p{font-size:12px;max-width:300px;padding-right:22px}.import-box{margin-top:22px;padding:5px;gap:5px}.import-box #url{font-size:13px;padding:12px}.import-box #go{padding:0 15px}
    .wrap{padding:27px 14px 55vh}.screen-heading{margin-bottom:14px;padding:0 3px}.screen-heading h2{font-size:24px}
    ul.eps{grid-template-columns:1fr;gap:10px}ul.eps li{min-height:108px;grid-template-columns:70px minmax(0,1fr) 24px;padding:12px;border-radius:18px;gap:12px}.episode-cover{width:70px;border-radius:13px}.t{font-size:14px}.badge{font-size:9px;padding:3px 7px}.episode-open{width:24px;height:24px}
    .reader-head{padding:0 4px;margin-bottom:14px}h2.ep{font-size:29px}.toolbar{top:67px;margin:0 -4px 18px;padding:8px;border-radius:15px;flex-wrap:wrap;justify-content:space-between;overflow:visible}.toolbar::-webkit-scrollbar{display:none}.toolbar .grow{display:none}.toolbar #epMeta{display:none}
    .toolbar button,.toolbar label{min-height:38px;padding:7px 10px}.toolbar #rateCtl input,.toolbar #fsCtl input{display:none}
    article{--fs:18px;border:0;border-radius:0;margin:0 -14px;padding:25px 18px 80px;background:color-mix(in srgb,var(--surface) 72%,transparent);box-shadow:none;line-height:1.82}
    .vg{border-radius:18px;padding:15px}.vg-h{align-items:flex-start;flex-wrap:wrap}.vg-h .vt{flex:1 1 70%}.vitem{gap:8px}.vs{font-size:13px}

  }
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>

<script>
const $ = s => document.querySelector(s);
// 离线缓存: 把最后一次 /sync 的结果留在本地。断网时正文、中译、已查过的词义都还能用。
const OFFLINE_KEY = 'et.offline';
function saveOffline(d){
  try { localStorage.setItem(OFFLINE_KEY, JSON.stringify({ at: Date.now(), data: d })) } catch(e){}
}
function loadOffline(){
  try { const raw = localStorage.getItem(OFFLINE_KEY); return raw ? JSON.parse(raw) : null } catch(e){ return null }
}
function offlineEpisode(id){
  const c = loadOffline();
  if(!c) return null;
  return (c.data.episodes || []).find(e => e.episode.id === id) || null;
}

// 服务端 token。设了 ET_TOKEN 时, 后端会把 token 注入到这里的 __ET_TOKEN__;
// 也支持 ?token=xxx 手输一次(存本地, 之后所有请求自动带上)。
// 不设 token 时这里是空串, 一切照旧。
const ET_TOKEN = (() => {
  // 占位符本身要当成"服务端没注入 token"来处理。
  // 之前判据写错, 导致没设 token 的部署里 ET_TOKEN 变成字面量 '__ET_TOKEN__',
  // 于是每个请求都带上一个假 token, 从地址栏点进来的 ?token= 也永远不会被存下来。实测踩过。
  const raw = '__ET_TOKEN__';
  const injected = raw.indexOf('__ET_') === 0 ? '' : raw;
  const fromUrl = new URLSearchParams(location.search).get('token');
  if(fromUrl){
    try{ localStorage.setItem('et.token', fromUrl) }catch(e){}
    // 顺手把地址栏里的 token 抹掉, 免得被书签/截图带出去
    try{ history.replaceState(null, '', location.pathname + location.hash) }catch(e){}
    return fromUrl;
  }
  if(injected) return injected;
  try{ return localStorage.getItem('et.token') || '' }catch(e){ return '' }
})();
function apiHeaders(extra){
  const h = Object.assign({}, extra || {});
  if(ET_TOKEN) h['Authorization'] = 'Bearer ' + ET_TOKEN;
  return h;
}

const api = (p, o) => {
  const opt = Object.assign({}, o || {});
  opt.headers = apiHeaders(opt.headers);
  return fetch(p, opt).then(async r => {
    const t = await r.text();
    let j; try { j = JSON.parse(t) } catch { j = {detail:t} }
    if (!r.ok){
      const err = new Error(j.detail || r.status);
      err.status = r.status;
      if(r.status === 401) err.message = '未授权: token 不对或没带(在地址后加 ?token=你的token)';
      throw err;
    }
    return j;
  }).catch(err => {
    // 只读接口断网时尝试离线数据, 写操作必须失败(否则你会以为标记成功了)
    const method = (o && o.method) || 'GET';
    if(method !== 'GET') throw err;
    const m = /^\/episodes\/([A-Za-z0-9]+)$/.exec(p);
    if(m){
      const ep = offlineEpisode(m[1]);
      if(ep) return { ...ep, episode: ep.episode, offline: true };
    }
    if(p === '/episodes'){
      const c = loadOffline();
      if(c) return (c.data.episodes || []).map(e => e.episode);
    }
    if(p === '/vocab'){ const c = loadOffline(); if(c) return (c.data.vocab || []) }
    throw err;
  });
};

let current = null, segments = [], vocab = new Set(), curIdx = -1;
let anchorIdx = -1;    // 当前"该停在哪"的那一句。用户拖进度条后它可能不等于 curIdx
let finding = false;   // 正在定位播放头时, 暂时关掉跨句检测, 免得抢走音频控制

// 生词本: 从生词本点一个词 -> 打开它所在那一集的原文时, 要落回那一句。
// 用模块级变量而不是 hash 参数: hash 已经是 #<episode_id> 了, 再往里塞句子号
// 会和"刷新/分享链接"那套逻辑打架(见文件末尾的 popstate/hashchange)。
let jumpSeg = null;              // 待定位的句子号, 消费一次就清掉
const vocabState = { groups: [], items: [], total: 0, raw: 0, err: '' };

// ===== 播放器状态 =====
// 关键设计: 音频属于「playing.id」这一集, 而不是「current」(正在读的那一集)。
// 两者分离之后, 从阅读页返回列表、甚至打开另一集, 声音都不会断。
let audio = null;
const playing = { id: null, title: '', show: '', art: '', duration: 0, pending: null, clips: [], primed: null, loaded: false };
const segsCache = new Map();          // episode_id -> segments(播完的集不重复拉)
let dragging = false;                  // 正在拖进度条时先别让 timeupdate 抢走滑块
let tick = 0;                          // 定时器计数, 用来降频刷新界面
let zhMap = new Map(), zhReady = false;
// 中译开关默认关: 它的定位是「读不懂时垫底」, 而不是常驻的第二语言栏。
let showZh = localStorage.getItem('et.showzh') === '1';

// ---------- 列表 ----------
async function loadList(){
  const eps = await api('/episodes');
  const el = $('#list');
  const count = $('#listIntro .heading-count');
  if(count) count.textContent = eps.length ? eps.length + ' episodes' : 'Start here';
  if(!eps.length){ el.innerHTML = '<div class="empty">还没有内容。<br>在上方粘贴一条播客链接开始。</div>'; return; }
  el.innerHTML = '<ul class="eps">' + eps.map(e => `
    <li data-id="${e.id}">
      <div class="episode-cover">${e.show_image ? `<img src="${esc(e.show_image)}" alt="" referrerpolicy="no-referrer">` : 'READ'}</div>
      <div class="episode-copy">
        <div class="t">${esc(e.title)}</div>
        <div class="m">${esc(e.show_title||'')} ${e.published_at? '· '+esc(String(e.published_at).slice(0,10)):''}
          ${e.state==='ready'? '· '+e.seg_count+' 句':''}</div>
        <div class="m"><span class="badge ${e.state}">${stateZh(e.state)}</span></div>
      </div>
      <span class="episode-open" aria-hidden="true">›</span>
    </li>`).join('') + '</ul>';
  el.querySelectorAll('li').forEach(li => li.onclick = () => openEpisode(li.dataset.id, true));
  const busy = eps.some(e => !['ready','failed'].includes(e.state));
  if(busy) setTimeout(() => { if($('#reader').style.display==='none') loadList() }, 5000);
}

function stateZh(s){ return {pending:'排队',downloading:'下载中',transcribing:'转录中',
  segmenting:'分段中',translating:'翻译中',ready:'可读',failed:'失败'}[s] || s }

// ---------- 阅读 ----------
async function openEpisode(id, push){
  $('#status').textContent = '加载…';
  let data;
  try{
    data = await api('/episodes/'+id);
  }catch(err){
    // 打不开一集(网络/token/数据没了)时要明说, 否则页面永远停在"加载…"
    $('#status').textContent = '打不开这一集: ' + err.message;
    $('#list').style.display='block'; $('#reader').style.display='none';
    $('#back').style.display='none';
    loadList();
    return;
  }
  current = data.episode; segments = data.segments; vocab = new Set(data.vocab_lemmas);
  zhMap = new Map((data.translations||[]).map(t => [t.seg_idx, t.text]));
  zhReady = zhMap.size > 0;
  $('#list').style.display='none'; $('#vocab').style.display='none'; $('#reader').style.display='block'; $('#back').style.display='';
  $('#epTitle').textContent = current.title;
  $('#epMeta').textContent = (current.show_title||'') +
    (current.duration_sec? ' · '+Math.round(current.duration_sec/60)+' 分钟':'') +
    ' · '+segments.length+' 句';
  document.body.classList.add('reading');
  syncViewChrome();
  if(push) history.pushState({id}, '', '#'+id);

  if(current.state !== 'ready'){
    // 失败要给出原因和出路。以前只有 error 非空才显示重试按钮, 而下载/转录/分段这些
    // 中间状态写库时 error 是 NULL —— 一旦卡在中间态, 界面就只剩一句"转录中…"永久轮询,
    // 既没有重试也永远等不到结果(实测踩过)。
    $('#article').innerHTML = `<div class="empty">${stateZh(current.state)}…${
      current.error? '<br><br><code>'+esc(current.error)+'</code>':''}<br><br><button id="rt">重试</button></div>`;
    const rt = $('#rt'); if(rt) rt.onclick = async () => {
      try{ await api(`/episodes/${id}/retry`,{method:'POST'}); loadList(); openEpisode(id,false) }
      catch(err){ $('#status').textContent = '重试失败: ' + err.message }
    };
    if(current.state==='failed') return;
    setTimeout(() => { if(current && current.id===id) openEpisode(id,false) }, 4000);
    return;
  }

  // 段落 -> 句子, 段落文本永远是 segments 的忠实拼接
  const paras = data.paragraphs;
  const html = paras.map(p => {
    const inner = segments.slice(p.start_seg_idx, p.end_seg_idx+1).map(s => {
      const zh = zhMap.get(s.idx);
      const zhHtml = zh ? `<span class="zh">${esc(zh)}</span>` : '';
      return `<span class="s" data-i="${s.idx}">${markWords(s.text, s.idx)}${zhHtml}</span>`;
    }).join(' ');
    return `<p>${inner}</p>`;
  }).join('');
  $('#article').innerHTML = html || '<div class="empty">没有文本</div>';
  // 记下"屏幕上这一集到底是哪一集、渲染了多少句"。
  // 页面外部(自动化测试/调试脚本)需要一个可靠的判据来判断正文是否真的换过来了:
  // 只比较标题会被"标题先改、正文后到"的时序骗过去。
  window.__etLoaded = { id, title: current.title || '', segs: segments.length, at: Date.now() };

  // 点句子播放、点单词查词。手机上点句子容易误中单词, 所以:
  // **只有点到"值得查的词"才弹释义卡, 虚词直接放行去播放这一句。**
  // 误触大多落在 the / of / and 这类短词上, 放行它们就能消掉大部分误弹。
  // (试过弹底部动作表来彻底消除歧义 —— 但那把一堆虚词也列成了按钮, 更吵, 已回退。)
  const isLookupWorthy = (w) => {
    const t = (w || '').replace(/[^A-Za-z'’\-]/g, '');
    return t.length >= 4 || vocab.has(t.toLowerCase());
  };
  // 一律用 closest() 解析真实目标: ev.target 可能是句子内部的其它元素
  // (例如塞在单词里的中译 span), 只看 target 会漏掉点击(实测踩过: 点了没反应)。
  $('#article').querySelectorAll('.s').forEach(sp => {
    sp.onclick = ev => {
      const w = ev.target.closest && ev.target.closest('.w');
      if(w && isLookupWorthy(w.dataset.w)) return;    // 值得查的词由词的 handler 处理
      playSeg(current.id, +sp.dataset.i);
    };
  });
  $('#article').querySelectorAll('.w').forEach(w => {
    w.onclick = ev => {
      if(!isLookupWorthy(w.dataset.w)) return;        // 虚词: 不当查词, 让冒泡去播放
      ev.stopPropagation();
      openWord(w, +w.closest('.s').dataset.i);
    };
  });
  syncZhToggle();
  lastScrolledIdx = -1;      // 换了一集, 滚动记忆要清掉
  userScrolledAt = 0;
  window.scrollTo(0, 0);
  // 从生词本点进来的话, 直接落到当初标这个词的那一句上。放在 scrollTo(0,0) 之后 ——
  // 顺序反了就白跳了(先定位、再被拉回页首, 看起来就是"跳转没生效")。
  // 这条提示要顶住函数末尾那次 status 覆盖, 所以用 jumped 标记挡一下。
  let jumped = false;
  if(jumpSeg != null){
    const want = jumpSeg; jumpSeg = null;
    if($(`.s[data-i="${want}"]`)){
      lastScrolledIdx = -1;
      scrollToSeg(want, true, true);
      setHighlightCursor(want);
      jumped = true;
    }
  }
  // 这一集如果正在播, 正文里的标记要跟上
  if(playing.id === id && audio){
    const cs = clipsOf(id);
    if(cs.length){
      const here = cs.filter(c => c.start_sec <= audio.currentTime + 0.05).pop();
      if(here){ anchorIdx = here.idx; setHighlight(here.idx) }
    }
  }
  // 播放条不该等到"点了播放"才出现。播客软件里, 只要你跟这一集发生过关系,
  // 它就一直在底部等着你接着听 —— 刷新页面也一样(实测反馈: 刷新后以为播放器没做出来)。
  const saved = JSON.parse(localStorage.getItem('et.pos.' + id) || 'null');
  const hasPlayer = playing.id === id;
  // jumped 时不吃「上次听到」的进度: 你是从生词本明确跳到某一句的, 再按进度把视野
  // 拉回上次的位置, 跳转就等于没发生(实测踩过: 目标句被顶到视口上方约 70px)。
  if(!hasPlayer && saved && !jumped){
    playing.id = id;
    playing.title = current.title || '';
    playing.show = current.show_title || '';
    playing.art = current.show_image || '';
    playing.duration = current.duration_sec || 0;
    playing.primed = saved.t || 0;      // 记着从哪接着听
    document.body.classList.add('hasPlayer');
    $('#bar').classList.add('on');
    syncPlayerUI();
  }
  if(hasPlayer) playing.primed = null;
  syncViewChrome();
  if(jumped){
    $('#status').textContent = '已跳到标这个词的那一句';
    return;
  }
  $('#status').textContent = hasPlayer
    ? (audio && !audio.paused ? followStatus('播放中') : followStatus('已暂停'))
    : (saved ? '上次听到 ' + fmtTime(saved.t) + '(点播放接着听)' : '可读');
}

// 中译开关。没有翻译时点开 -> 触发后台补生成, 完成后自动显示。
function syncZhToggle(){

function pollTranslations(id){

  const t = setInterval(async () => {
    tries++;
    if(!current || current.id !== id || tries > 60){ clearInterval(t); return }
    try{
      const d = await api('/episodes/'+id);
      if((d.translations||[]).length){
        clearInterval(t);
        zhMap = new Map(d.translations.map(x => [x.seg_idx, x.text]));
        zhReady = true;
        // 就地补上中译, 不重排已经渲染好的文章
        // 就地补上中译, 不重排已经渲染好的文章
        $('#article').querySelectorAll('.s').forEach(sp => {
          const zh = zhMap.get(+sp.dataset.i);
          if(zh && !sp.querySelector('.zh')){
            const el = document.createElement('span');
            el.className = 'zh'; el.textContent = zh;
            sp.appendChild(el);
          }
        });
        showZh = true;
        localStorage.setItem('et.showzh', '1');
        syncZhToggle();
        $('#status').textContent = '中译已就绪';

  }, 3000);

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }

function markWords(text, segIdx){
  return esc(text).replace(/[A-Za-z][A-Za-z'’\-]*/g, m => {
    const key = m.toLowerCase();
    const marked = vocab.has(key) ? ' marked' : '';
    return `<span class="w${marked}" data-w="${esc(m)}">${m}</span>`;
  });
}

// ---------- 播放 ----------
// 语速默认 0.75 倍: 英文播客原速对本项目的用途(核听 + 精读)偏快, 慢放更容易跟上。
// 设置存 localStorage, 不用每次重调。
// 语速档位: 0.5 / 0.75 / 1 / 1.25 / 1.5 / 2
// 滑块(step=0.25)和全屏那个循环按钮共用这一份, 免得两处各写一套、日后改出不一致。
const RATE_STEPS = [0.5, 0.75, 1, 1.25, 1.5, 2];
/** 把任意值吸附到最近的档位 —— 旧版本存过 0.6/0.9 这类值, 要能落到合法档上。 */
function snapRate(v){
  const n = parseFloat(v);
  if(!isFinite(n)) return 1;
  let best = RATE_STEPS[0], bestD = Infinity;
  for(const r of RATE_STEPS){ const d = Math.abs(r - n); if(d < bestD){ bestD = d; best = r } }
  return best;
}
function setRate(v, persist){
  rate = snapRate(v);
  if(persist !== false) localStorage.setItem('et.rate', String(rate));
  applyRate();
}

// 初始化时就把值吸附并写回: 否则 localStorage 里会一直留着 0.6 / 0.9 这类
// 旧版本存下的非法档位, 虽然显示和播放都正常, 但下次读出来还要再纠正一遍。
let rate = snapRate(localStorage.getItem('et.rate') || '1');
try { localStorage.setItem('et.rate', String(rate)) } catch(e){}
let autoNext = localStorage.getItem('et.autonext') === '1';
// 跟随滚动默认关。这是「读为主」的必然结论:
// 每句都滚一次 = 每分钟约 20 次平滑滚动, 页面永远在你脚下移动,
// 你低头看一个词, 高亮句就被推出屏幕了(实测反馈: "自动划到底部, 标识也消失")。
// 需要躺着连续听的时候再自己打开。
// 跟随滚动**默认开**: 点开始阅读就该自动跟着读下去。
// 你一旦自己滑屏超过阈值(见 maybeUnfollow), 它自动关掉, 不再和你抢屏幕。
let autoScroll = localStorage.getItem('et.autoscroll') !== '0';

function fmtRate(v){ return (Math.round(v*100)/100) + '×' }

function applyRate(){
  if(audio) audio.playbackRate = rate;
  const lbl = fmtRate(rate);
  $('#rate').value = rate; $('#rateVal').textContent = lbl;
  const f = $('#fullRateVal'); if(f) f.textContent = lbl;
}
$('#rate').oninput = e => setRate(e.target.value);
// 工具栏上的语速按钮: 点一下进下一档。
// 原来是"语速 + 滑块 + 数值"三项挤在一行, 被同排的胶囊按钮挤出了屏幕右边缘
// (实测 x=378~446 而视口只有 390), 而且滑块被设成 display:none 后无法操作。
// 现在只留一个大按钮, 点一下换一档; 全屏播放器里的「语速」走同一份档位表。
const cycleRate = () => {
  const i = RATE_STEPS.findIndex(v => Math.abs(v - rate) < 0.001);
  setRate(RATE_STEPS[(i + 1) % RATE_STEPS.length]);
};
$('#rateCtl').onclick = cycleRate;
$('#rateReset').onclick = () => setRate(1);
$('#autonext').checked = autoNext;
$('#autonext').onchange = e => {
  autoNext = e.target.checked;
  localStorage.setItem('et.autonext', autoNext ? '1' : '0');
  // 连续听就必须跟着滚, 否则声音跑到你看不见的地方去了
  if(autoNext && !autoScroll){
    autoScroll = true;
    localStorage.setItem('et.autoscroll', '1');
    syncAutoScroll();
    scrollToSeg(curIdx, true);
  }
};
function syncAutoScroll(){
  const b = $('#locateBtn');
  if(b){ b.classList.toggle('following', autoScroll); b.title = autoScroll
    ? '正在跟随播放位置(滑屏可取消)'
    : '点一下回到你正在读的那一句, 并重新跟随' }
}

// 你当前"读到哪一句": 取视野上方三分之一处那一句。
// 用它可以实现"滑到别处看完, 一键回到刚才的位置"(而不是永远回到正在播的那句)。
function readingAnchorIdx(){
  if(!segments.length) return curIdx;
  const line = window.innerHeight * 0.33;
  let best = null, bestTop = -Infinity;
  for(const s of segments){
    const el = $(`.s[data-i="${s.idx}"]`);
    if(!el) continue;
    const r = el.getBoundingClientRect();
    if(r.top <= line && r.top > bestTop){ bestTop = r.top; best = s.idx }
  }
  return best === null ? curIdx : best;
}

function followStatus(prefix){
  return autoScroll ? (prefix ? prefix + ' · 跟随中' : '跟随中') : (prefix || '');
}
/** 播放状态变了就刷新状态栏, 让"跟随中/已停止跟随"随时可见。 */
function refreshStatusLine(){
  if(!current || !playing.id || playing.id !== current.id) return;
  if(playing.primed != null) return;
  $('#status').textContent = (audio && !audio.paused) ? followStatus('播放中') : followStatus('已暂停');
}
function locateCurrent(){
  const idx = curIdx >= 0 ? curIdx : readingAnchorIdx();
  if(idx === null || idx < 0) return;
  autoScroll = true;                      // 定位 = 重新开始跟随
  localStorage.setItem('et.autoscroll', '1');
  syncAutoScroll();
  const b0 = $('#locateBtn'); if(b0) b0.classList.remove('attention');
  lastScrolledIdx = -1;
  scrollToSeg(idx, true, true);
  setHighlightCursor(idx);
  $('#status').textContent = (idx === curIdx) ? '已定位到正在读的句子' : '已定位到这一句';
}

/** 给"你读到哪"的那一句加一个细边框标记, 和播放高亮区分开。 */
function setHighlightCursor(idx){
  document.querySelectorAll('.s.cursor').forEach(e => e.classList.remove('cursor'));
  const el = $(`.s[data-i="${idx}"]`);
  if(el) el.classList.add('cursor');
}

$('#locateBtn').onclick = locateCurrent;
$('#loopBtn').onclick = () => {
  if(!current) return;
  const idx = curIdx >= 0 ? curIdx : 0;
  playSeg(current.id, idx);
};
$('#playBtn').onclick = async () => {
  if(!current) return;
  if(playing.id === current.id && playing.primed != null){
    const at = playing.primed; playing.primed = null;
    await startEpisode(current, at);
    return;
  }
  // 播放器已经在放别的一集: 切到当前这一集继续
  if(playing.id && playing.id !== current.id){ startEpisode(current); return }
  if(!audio || !playing.id){ playSeg(current.id, curIdx >= 0 ? curIdx : 0); return }
  if(audio.paused){
    // 从当前句起点继续, 避免停在句子之间的静音间隙里
    const here = segAt(audio.currentTime);
    if(here) audio.currentTime = here.start_sec;
    audio.play().catch(e => $('#status').textContent = '播放失败: '+e.message);
  } else {
    audio.pause();
  }
  syncPlayerUI();
};

// ==================== 底部常驻播放器 ====================
$('#bar').onclick = (e) => { if(e.target.closest('button')) return; openFull() };
$('#barPlay').onclick = async (e) => {
  e.stopPropagation();
  // 预置状态(只有记录、还没有播放器): 从上次的位置建播放器并开播
  if(playing.primed != null){
    const at = playing.primed; playing.primed = null;
    const ep = (current && current.id === playing.id) ? current : { id: playing.id, title: playing.title, show_title: playing.show, show_image: playing.art, duration_sec: playing.duration };
    await startEpisode(ep, at);
    syncPlayerUI();
    return;
  }
  togglePlay();
};
$('#barClose').onclick = (e) => { e.stopPropagation(); stopAndClose() };
$('#fullDown').onclick = closeFull;
$('#fullPlay').onclick = togglePlay;
$('#fullBack15').onclick = () => skip(-15);
$('#fullFwd30').onclick = () => skip(30);
$('#fullRate').onclick = () => {
  // 按 RATE_STEPS 循环: 0.5 → 0.75 → 1 → 1.25 → 1.5 → 2 → 回到 0.5
  const i = RATE_STEPS.findIndex(v => Math.abs(v - rate) < 0.001);
  setRate(RATE_STEPS[(i + 1) % RATE_STEPS.length]);
};
$('#fullToEp').onclick = () => {
  if(!playing.id) return;
  closeFull();
  if(current && current.id === playing.id){ window.scrollTo({top: 0, behavior: 'smooth'}); return }
  location.hash = playing.id;
  openEpisode(playing.id, false);
};
// 点进度条任意位置跳转(按住可以拖)
function barSeek(clientX){
  const r = $('#fullBar').getBoundingClientRect();
  const p = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  const dur = (audio && isFinite(audio.duration) && audio.duration > 0) ? audio.duration : playing.duration;
  if(dur > 0) seekTo(p * dur);
}
$('#fullBar').addEventListener('pointerdown', (e) => {
  dragging = true; barSeek(e.clientX);
  $('#fullBar').setPointerCapture(e.pointerId);
});
$('#fullBar').addEventListener('pointermove', (e) => { if(dragging) barSeek(e.clientX) });
$('#fullBar').addEventListener('pointerup', (e) => {
  dragging = false;
  try { $('#fullBar').releasePointerCapture(e.pointerId) } catch(_) {}
});

// 播放位置落在哪一句。不要假设 segments[idx] 就是第 idx 句:
// Whisper 的片段起止时间会重叠, 数组下标和位置不是一回事。
function lastSeg(){ return segments.length ? segments[segments.length-1] : null }

function segAt(t){
  let best = null;
  for(const s of segments){ if(s.start_sec <= t + 0.05) best = s; else break }
  // 越界时不要返回 null —— 那会让「正在读哪句」的标识凭空消失, 是实测踩过的坑。
  // 超出最后一句起点之后, 就钉在最后一句上。
  return best || segments[0] || null;
}

// 音频真正该结束的位置。
// 取两者较大值: 转录时间轴可能超出音频(有 26 句实测如此), 那时靠 'ended' 事件收尾;
// 反过来音频尾部可能还有一段没有转录的静音, 用 min() 会把它截掉。
/** 是否真的播到了音频末尾。转录结束 ≠ 音频结束(尾部可能有未转录的广告)。 */
function atRealEnd(){
  const end = audioEndTime();
  if(end === null) return false;
  return audio.currentTime >= end - 0.5;
}

function audioEndTime(){
  const last = lastSeg();
  const bySeg = last ? last.end_sec + 2 : -Infinity;
  const bySrc = (audio && isFinite(audio.duration) && audio.duration > 0) ? audio.duration : -Infinity;
  const end = Math.max(bySeg, bySrc);
  return isFinite(end) ? end : null;
}

// ---------- 自动滚动 ----------
// 三个坑, 都是实测踩出来的:
// 1) 早期版本直接调 scrollIntoView({behavior:'smooth'}), 而定时器每 100ms 跑一次;
//    每 100ms 下达新指令会不断打断上一次动画, 看起来就是"页面自己往下滑"。
// 2) block:'center' 在段落靠近文末时会被浏览器 clamp 到最大滚动位置, 判据失效。
// 3) **最坑的一个**: 程序自己滚动会触发 scroll 事件, 早期版本据此认定"用户刚滚过",
//    于是接下来 3 秒内所有跟随滚动都被自己压制。连播时每句约 3.3 秒, 等于永远落在
//    压制窗口里 —— 表现就是"勾上连播, 滚一下就再也不跟了, 高亮跑出屏幕后看着像消失了"。
//    修法: 我们自己发起的滚动期间产生的 scroll 事件标记为程序产生, 不算用户意图。
let lastScrolledIdx = -1;
let userScrolledAt = 0;
let programmaticUntil = 0;   // 这个时间点之前收到的 scroll 事件是自己滚的
let manualDuringUntil = 0;   // 手指/滚轮刚动过的窗口
let outsidePx = 0;           // 当前句离"舒适区"有多远

// 手指按下就记一笔。用它区分"你主动滑"和"程序自己滚":
// 只有你真正触摸/滚轮之后产生的 scroll 才可能关闭跟随。
window.addEventListener('touchstart', () => { manualDuringUntil = Date.now() + 900 }, { passive: true });
window.addEventListener('wheel', () => { manualDuringUntil = Date.now() + 900; userScrolledAt = Date.now() }, { passive: true });
document.addEventListener('touchmove', () => { manualDuringUntil = Date.now() + 900; userScrolledAt = Date.now() }, { passive: true });

window.addEventListener('scroll', () => {
  if(Date.now() < programmaticUntil) return;       // 确定是自己滚的
  if(Date.now() > manualDuringUntil) return;       // 不是你的操作(惯性/布局变化等)
  userScrolledAt = Date.now();
  maybeUnfollow();
}, { passive: true });

/** 当前句被滑出多远(px)。在舒适区内为 0。 */
function outsideDistance(){
  if(curIdx < 0) return 0;
  const el = $(`.s[data-i="${curIdx}"]`);
  if(!el) return 0;
  const r = el.getBoundingClientRect();
  if(r.bottom < 0) return -r.bottom;                  // 滑过头了, 句子在上面
  if(r.top > window.innerHeight) return r.top - window.innerHeight;
  return 0;
}
const UNFOLLOW_PX = 110;   // 滑离当前句超过这么多, 就认为你要自己看

function maybeUnfollow(){
  if(!autoScroll) return;
  outsidePx = outsideDistance();
  if(outsidePx > UNFOLLOW_PX){
    autoScroll = false;
    localStorage.setItem('et.autoscroll', '0');
    syncAutoScroll();
    setHighlightCursor(readingAnchorIdx());
    $('#status').textContent = '已停止跟随(点「定位」回到当前句)';
    const b = $('#locateBtn'); if(b) b.classList.add('attention');
  }
}

function scrollToSeg(i, force, instant){
  if(i === undefined || i === null || i < 0) return;
  if(!force && !autoScroll) return;                    // 跟随滚动没开就不动页面
  if(i === lastScrolledIdx && !force) return;          // 同一句不重复滚
  if(!force && Date.now() - userScrolledAt < 4000) return;  // 你刚手动滚过, 别抢
  const el = $(`.s[data-i="${i}"]`);
  if(!el) return;
  const r = el.getBoundingClientRect();
  // 只在"快看不见了"时才滚: 落在视口中间三分之一就不动。
  // 每句都硬滚一次 = 页面永远在你脚下移动, 低头看个词高亮就跑掉了。
  const lo = window.innerHeight * 0.34;
  const hi = window.innerHeight * 0.66;
  if(r.top >= lo && r.bottom <= hi){ lastScrolledIdx = i; return }
  lastScrolledIdx = i;
  programmaticUntil = Date.now() + 1600;   // 接下来这段时间的 scroll 事件是我滚的
  // 定位这种明确动作要"瞬间到达": 距离可能几千像素, 平滑滚动要好几秒,
  // 期间你会以为它没反应(实测踩过)。跟随播放时仍用平滑滚动, 观感更连贯。
  el.scrollIntoView({ block:'center', behavior: instant ? 'auto' : 'smooth' });
}
// 明确保留的调试入口: 可在浏览器控制台里直接检验滚动逻辑, 不影响正常使用
window.__etScrollTo = (i, force) => scrollToSeg(i, force);

// ==================== 播放器核心 ====================
// 音频独立于「正在读的那一集」。所有播放入口都走这里。

function fmtTime(t){
  if(!isFinite(t) || t < 0) t = 0;
  const m = Math.floor(t / 60), sec = Math.floor(t % 60);
  return m + ":" + String(sec).padStart(2, '0');
}

function ensureAudio(){
  // 缓存的 audio 必须还在文档里。
  // 如果它被移出过 DOM(比如页面被别的脚本操作过、或浏览器回收了节点), 继续用它就会出现
  // "点句子没反应" —— 元素在内存里、时间也在走, 但它不在文档里, 查不到、也播不出声。
  // 实测踩过: 页面看起来一切正常, 底部播放条还在报"播放中", 但声音永远不出来。
  if(audio && audio.isConnected) return audio;
  if(audio && !audio.isConnected){
    try{ audio.pause() }catch(e){}
    audio = null;
    playing.loaded = false;
  }
  audio = document.createElement('audio');
  audio.id = 'etAudio';
  audio.preload = 'auto';
  document.body.appendChild(audio);
  audio.defaultPlaybackRate = rate;
  audio.playbackRate = rate;

  // 有些不守规矩的浏览器会重置倍速, 这里兜住
  audio.addEventListener('ratechange', () => {
    if(Math.abs(audio.playbackRate - rate) > 0.001) audio.playbackRate = rate;
  });
  audio.addEventListener('loadedmetadata', () => {
    if(isFinite(audio.duration) && audio.duration > 0) playing.duration = audio.duration;
    if(playing.pending !== null){ const p = playing.pending; playing.pending = null; seekTo(p) }
    syncPlayerUI();
  });
  audio.addEventListener('timeupdate', () => { if(!dragging) syncPlayerUI() });
  // 播放状态一变就刷新界面和状态栏。状态栏要能随时看出"跟随中/已停止跟随",
  // 否则你滑屏取消跟随后没有任何反馈(实测踩过: refreshStatusLine 定义了却没接上)。
  audio.addEventListener('play', () => { syncPlayerUI(); refreshStatusLine() });
  audio.addEventListener('pause', () => { syncPlayerUI(); refreshStatusLine() });
  audio.addEventListener('error', () => {
    // 清空 src / 换源的过程中, 浏览器一定会补发一次 error(MEDIA_ERR_SRC_NOT_SUPPORTED)。
    // 那不是真的加载失败, 报出来只会让人以为音频坏了(实测踩过: 停止播放后状态栏显示"加载失败")。
    if(!audio.currentSrc && (!audio.getAttribute('src') || audio.error?.code === 4)) return;
    $('#status').textContent = '音频加载失败, 检查这一集的音频是否还在 Mac 上';
  });
  // 源文件播完(转录时间轴有时会超出音频本身, 这时它会比"最后一句"更早触发)
  audio.addEventListener('ended', () => {
    const clips = clipsOf(playing.id);
    if(clips.length) setHighlight(clips[clips.length - 1].idx);
    $('#status').textContent = '已到结尾';
    syncPlayerUI();
  });
  return audio;
}

function clipsOf(epId){
  if(current && current.id === epId && segments.length) return segments;
  return segsCache.get(epId) || [];
}
async function loadClips(epId){
  if(current && current.id === epId && segments.length) return segments;
  if(segsCache.has(epId)) return segsCache.get(epId);
  const d = await api('/episodes/' + epId);
  const cl = d.segments || [];
  segsCache.set(epId, cl);
  return cl;
}

/** 让播放器指向某一集。返回 audio 元素。 */
function loadEpisode(ep){
  const a = ensureAudio();
  // 判断"是否已经加载过"必须用显式的 loaded 标记, **不能**用 playing.id === ep.id:
  // 播放条"预置"(刷新后显示上次位置)会提前把 playing.id 设上, 于是真正的加载被跳过,
  // src 一直是空的、readyState 停在 0, 点播放毫无反应。实测踩过。
  // 判定"已经加载过"必须同时看 src 还在不在:
  // 清空过 src(点过 ✕、或换源中途失败)之后, loaded 标记还留着, 但音频其实已经没了 ——
  // 这时如果直接返回, 后面 set currentTime / play() 全部作用在一个空源上,
  // 表现就是"点句子完全没反应, 状态栏也不报错"。实测踩过。
  const hasSrc = !!(a.getAttribute('src') || a.currentSrc);
  if(playing.loaded && playing.id === ep.id && hasSrc) return a;
  playing.id = ep.id;
  playing.loaded = true;
  playing.title = ep.title || '未命名单集';
  playing.show = ep.show_title || '';
  playing.art = ep.show_image || '';
  playing.duration = ep.duration_sec || 0;
  playing.pending = null;
  playing.primed = null;
  anchorIdx = -1;
  if(audio) { audio.pause(); audio.currentTime = 0 }
  a.src = `/episodes/${ep.id}/audio`;
  a.load();
  document.body.classList.add('hasPlayer');
  $('#bar').classList.add('on');
  syncPlayerUI();
  return a;
}

/** 从头开始播某一集(不需要先打开正文)。 */
async function startEpisode(ep, atSec){
  playing.primed = null;
  loadEpisode(ep);
  await loadClips(ep.id);
  playing.pending = atSec || 0;
  ensureAudio().play().catch(e => { $('#status').textContent = '播放失败: ' + e.message });
}

/** 从某一集的第 idx 句开始播。idx 为空则从头/当前位置继续。 */
async function playSeg(epId, idx){
  // 入口校验: 签名是 (epId, idx)。漏传 epId 会让 id 收到一个数字、idx 变 undefined,
  // 然后静默走"从头继续播"那条路 —— 实测踩过, 找了两轮才定位。
  // 这类"调用点漏改"必须立刻炸出来, 不能降级。
  if(typeof epId !== 'string' || !epId){
    console.error('playSeg 调用错误: 第一个参数必须是 episode id, 收到', epId, idx);
    return;
  }
  const ep = (current && current.id === epId) ? current : null;
  if(!ep) { // 不是当前打开的那一集: 先问接口拿元信息
    const d = await api('/episodes/' + epId);
    loadEpisode(d.episode);
    segsCache.set(epId, d.segments || []);
  } else {
    loadEpisode(ep);
    segsCache.set(epId, segments);
  }
  const clips = clipsOf(epId);
  if(idx === null || idx === undefined){
    // 继续播。注意**不要**清 playing.pending: 它可能是"从上次位置接着听"留下的,
    // 由 loadedmetadata 消费。之前这里顺手清掉, 导致点播放又从 0 开始。
    ensureAudio().play().catch(()=>{});
    if(audio && audio.readyState < 1 && playing.pending == null) playing.pending = null;
    return;
  }
  const seg = clips.find(c => c.idx === idx); if(!seg) return;
  anchorIdx = idx;                       // 锚点重置: 用户主动选了新的一句
  // 必须先作废"待跳位置": 否则音频还没加载完元数据时, 这里设的 currentTime 会被
  // 随后的 loadedmetadata -> seekTo(pending=0) 覆盖回开头。
  // 实测踩过: 点第 7 句却从头开始播, 因为元数据在那个瞬间才加载完。
  playing.pending = null;
  const a = ensureAudio();
  if(a.readyState >= 1) a.currentTime = seg.start_sec;
  else { a._wantSeek = seg.start_sec; a.addEventListener('loadedmetadata', () => {
      if(a._wantSeek != null && playing.pending === null){ a.currentTime = a._wantSeek; a._wantSeek = null }
    }, { once: true }) }
  a.play().catch(e => { $('#status').textContent = '播放失败: ' + e.message });
  if(current && current.id === epId){ setHighlight(idx); scrollToSeg(idx) }
  else { curIdx = -1 }
  syncPlayerUI();
}

/** 从某个秒数开始播(进度条 / 快进快退用)。 */
function seekTo(sec){
  const a = ensureAudio();
  if(!isFinite(a.duration) || a.duration <= 0){ playing.pending = sec; return }
  playing.pending = null;   // 已经能跳了, 不再留待跳标记(否则会被别的回调再跳一次)
  a.currentTime = Math.max(0, Math.min(sec, a.duration - 0.3));
  // 跳完之后锚点必须跟着走, 否则定时器会把你拖到的位置当成"当前句自然播完了":
  // 转录只覆盖到 52:31, 而音频有 58:15 —— 拖到 53 分钟之后时, 播放头远远越过锚点句的
  // 结束时间, 边界判定就以为该切下一句, 而"下一句"不存在, 于是直接判定"已到结尾"并暂停。
  // 实测踩过: 拖到 3200s 之后立刻停住, 状态显示"已到结尾"。
  anchorIdx = -1;
  const clips = clipsOf(playing.id);
  if(clips.length){
    const here = clips.filter(c => c.start_sec <= a.currentTime + 0.05).pop();
    if(here){
      anchorIdx = here.idx;
      if(current && current.id === playing.id){ setHighlight(here.idx); scrollToSeg(here.idx) }
    }
  }
  syncPlayerUI();
}
function skip(delta){
  if(!audio) return;
  seekTo((audio.currentTime || 0) + delta);
}

function togglePlay(){
  if(!audio || !playing.id) return;
  if(audio.paused){
    // 继续播: 不要走 playSeg(...,null) —— 那条路径在某些时序下会把位置重置。
    // 停在句子间隙里时, 先回到当前句起点再播。
    const clips = clipsOf(playing.id);
    if(clips.length){
      const here = clips.filter(c => c.start_sec <= audio.currentTime + 0.05).pop();
      if(here && current && current.id === playing.id){ anchorIdx = here.idx; audio.currentTime = here.start_sec }
    }
    audio.play().catch(e => { $('#status').textContent = '播放失败: ' + e.message });
  } else {
    audio.pause();
  }
  syncPlayerUI();
}
function stopAndClose(){
  // 这里必须把元件整个放掉(而不只是清 src):
  // 只清 src 的话 audio 还在, 下一次点句子的 set currentTime/play 会作用在空源上,
  // 一声不响地失败 —— 也就是"✕ 之后再也放不出声音"。
  if(audio){ try{ audio.pause() }catch(e){} ; audio.removeAttribute('src'); try{ audio.load() }catch(e){} ; audio.remove(); audio = null }
  playing.id = null; playing.loaded = false; playing.primed = null; playing.title = ''; playing.clips = [];
  $('#bar').classList.remove('on');
  document.body.classList.remove('hasPlayer');
  closeFull();
}

// ==================== 播放器界面 ====================
function syncPlayerUI(){
  if(!playing.id) return;
  const a = audio;
  const primed = playing.primed;      // 还没真正建播放器时, 用记录里的位置显示进度
  const dur = (a && isFinite(a.duration) && a.duration > 0) ? a.duration : (playing.duration || 0);
  const cur = a ? (a.currentTime || 0) : (primed || 0);
  const pct = dur > 0 ? Math.min(100, (cur / dur) * 100) : 0;

  $('#barTitle').textContent = playing.title;
  // 有节目封面就用真封面, 没有就退回耳机图标
  const setArt = (sel) => {
    const el = $(sel); if(!el) return;
    if(playing.art){
      if(el.dataset.art !== playing.art){
        el.dataset.art = playing.art;
        el.innerHTML = `<img src="${playing.art}" alt="" referrerpolicy="no-referrer">`;
      }
    } else if(el.dataset.art !== 'none'){
      el.dataset.art = 'none'; el.textContent = '🎧';
    }
  };
  setArt('#barCover'); setArt('#fullArt');
  const clips = clipsOf(playing.id);
  const here = clips.filter(c => c.start_sec <= cur + 0.05).pop();
  const isCurrentEp = current && current.id === playing.id;
  $('#barSub').textContent = (primed != null ? '上次听到这里' : (a && !a.paused ? '播放中' : '已暂停'))
    + (dur ? ' · ' + fmtTime(cur) + ' / ' + fmtTime(dur) : '')
    + (!primed && isCurrentEp && here ? ' · ' + (here.idx + 1) + '/' + clips.length + ' 句' : '');
  $('#barPlay').textContent = (a && !a.paused) ? '❚❚' : '▶';
  $('#barFill').style.width = pct + '%';

  // 记住播放位置, 下次进来能接着听
  if(isFinite(cur) && cur > 0 && tick % 8 === 0){
    try { localStorage.setItem('et.pos.' + playing.id, JSON.stringify({ t: Math.floor(cur), idx: here ? here.idx : null })) } catch(e){}
  }

  const b = $('#playBtn');
  if(b) b.textContent = (isCurrentEp && a && !a.paused) ? '❚❚ 暂停' : '▶ 播放';

  if($('#full').classList.contains('on')){
    $('#fullTitle').textContent = playing.title;
    $('#fullSub').textContent = playing.show || '';
    $('#fullCur').textContent = fmtTime(cur);
    $('#fullDur').textContent = fmtTime(dur);
    $('#fullBarFill').style.width = pct + '%';
    $('#fullBarKnob').style.left = pct + '%';
    $('#fullPlay').textContent = (a && !a.paused) ? '❚❚' : '▶';
    $('#fullRateVal').textContent = fmtRate(rate);
  }
}
// 兼容旧调用点(工具栏按钮等)
function syncPlayBtn(){ syncPlayerUI() }

function openFull(){ $('#full').classList.add('on'); syncPlayerUI(); syncViewChrome() }
function closeFull(){ $('#full').classList.remove('on'); syncViewChrome() }

function setHighlight(i){
  if(curIdx>=0){ const p = $(`.s[data-i="${curIdx}"]`); if(p) p.classList.remove('cur') }
  curIdx = i; const el = $(`.s[data-i="${i}"]`); if(el) el.classList.add('cur');
}

// 句子归属由「播放位置」唯一决定, 不管你是点进去的还是自然播到的。
// 到了当前句末尾: 连播就接着下一句, 否则停下等你处理生词。
setInterval(() => {
  if(!audio || audio.paused || finding) return;
  tick++;

  // 逐句逻辑只对「正文正在读的那一集」生效。
  // 如果你在列表页、或者打开的是别的一集, 播放器照常放, 只是不做断句停顿
  // —— 音频本来就独立于当前显示的内容, 这是刻意的。
  const isOpen = current && playing.id === current.id;
  if(!isOpen || !segments.length){ syncPlayerUI(); return }

  // 先判结束: 转录时间轴可能超出音频本身, 播到头了就把标记钉在最后一句上,
  // 不能让它消失(实测踩过: 读完最后一集广告后高亮没了、页面还往下跑)。
  const endAt = audioEndTime();
  if(endAt !== null && audio.currentTime >= endAt){
    const last = lastSeg();
    if(last && last.idx !== curIdx) setHighlight(last.idx);
    finding = true;
    audio.pause();
    setTimeout(() => { finding = false }, 60);
    $('#status').textContent = '已到结尾';
    syncPlayerUI();
    return;
  }

  const here = segAt(audio.currentTime);
  if(!here) return;
  if(anchorIdx < 0) anchorIdx = here.idx;

  // 你手动拖了进度条: 基准跟着你的位置走, 不要自作主张地暂停。
  if(here.idx - anchorIdx > 1){
    anchorIdx = here.idx;
    setHighlight(here.idx);
    scrollToSeg(here.idx);
    return;
  }

  let anchor = segments.find(s => s.idx === anchorIdx);
  if(!anchor) return;

  // 兜底: 如果播放头根本不在锚点句的范围内(说明是外部拖动/跳转, 不是从这句自然播过来的),
  // 就把锚点重新对准当前位置, 不要拿旧的锚点去判定"该不该切下一句"。
  if(audio.currentTime > anchor.end_sec + 3 || audio.currentTime < anchor.start_sec - 3){
    const at = segAt(audio.currentTime);
    if(at){
      anchorIdx = at.idx; anchor = at;
      setHighlight(at.idx);
      if(autoNext) scrollToSeg(at.idx);
      return;
    }
  }

  // 还没播完锚点这一句 —— 用这句自己的 end 判定, 不要等"进入下一句"。
  // 实测踩过的坑: 靠"进度已进入下一句"来发现边界会晚 0.1~2.5 秒
  // (第 7 句结束于 35.82s, 第 8 句从 38.34s 才开始), 于是停顿位置和高亮错开一句。
  if(audio.currentTime <= anchor.end_sec + 0.08) return;

  // ---- 到这里就是真正的「句子边界」, 停/继续的决策只能在这里做 ----
  const next = segments.find(s => s.start_sec > anchor.end_sec - 0.05);

  if(autoNext){
    if(next) playSeg(playing.id, next.idx);   // 精确跳到下一句起点, 顺便跳过间隙
    else {
      // 转录到头了, 但音频可能还有内容 —— 实测这一集音频 58:15、转录只到 52:31,
      // 尾部近 6 分钟是注入的广告, 没有转录。这种情况下必须继续放完, 不能提前宣布
      // "已到结尾"停住: 停在这个位置后一旦再按播放, 播放头会被拉回锚点句起点,
      // 听起来就是"跳回前面重放"。真正的结尾只由源文件结束/audioEndTime 决定。
      if(!atRealEnd()) return;
      finding = true; audio.pause(); setTimeout(() => { finding = false }, 60);
      $('#status').textContent = '已到结尾';
      syncPlayerUI();
    }
  } else {
    // 回到刚播完那一句的起点停下等你处理生词。
    // 不要停在静音间隙里, 否则点 ↻ 重听时前几个词会被吃掉。
    finding = true;
    // 先记下"真实播到哪": 下面会把播放头退回句首, 否则记住的位置会丢掉这最后一句
    // (实测踩过: 播了 9 秒, 记录里只有 0:06, 因为记的是重置之后的值)。
    if(!next && !atRealEnd()){
      // 已经是最后一句、但音频还有没转录的内容 -> 不要在这里停, 让它放完
      // (否则停下后按播放会被拉回锚点句起点, 表现为"跳回前面")
      anchorIdx = anchor.idx;
      return;
    }
    const truePos = audio.currentTime;
    audio.pause();
    audio.currentTime = anchor.start_sec;
    setTimeout(() => { finding = false }, 60);
    try { localStorage.setItem('et.pos.' + playing.id,
      JSON.stringify({ t: Math.floor(truePos), idx: anchor.idx })) } catch(e){}
    // 高亮留在「刚读完这一句」上, 不要提前跳到下一句:
    // 播放头停在 anchor、高亮却指着 next, 看起来就是"标记跟我读的那句错开了"。
    setHighlight(anchor.idx);
    scrollToSeg(anchor.idx);
    $('#status').textContent = '本句结束(↻ 重听 / 空格)';
    syncPlayerUI();
    return;
  }
  // 连播: 高亮跟着下一句走, 顺便把锚点推进
  if(next){ anchorIdx = next.idx; setHighlight(next.idx); scrollToSeg(next.idx) }
}, 100);

// ---------- 释义 ----------
let pendingWord = null;
async function openWord(el, segIdx){
  const word = el.dataset.w;
  const seg = segments.find(s => s.idx === segIdx);
  pendingWord = { word, sentence: seg ? seg.text : '', episode_id: current.id, seg_idx: segIdx };
  $('#pWord').textContent = word;
  $('#pBody').innerHTML = '<div class="m">查询中…</div>';
  syncMarkBtn(word);
  $('#pop').showModal();
  try{
    const r = await api('/define', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({word, sentence: pendingWord.sentence})});
    renderDef(r);
  }catch(e){
    $('#pBody').innerHTML = `<div class="m">${esc(e.message)}</div>`;
  }
}
function renderDef(r, target){
  const d = r.payload || {};
  const li = a => (a||[]).map(x => `<li>${esc(typeof x==='string'? x : (x.zh? x.sense+' — '+x.zh : (x.word? x.word+' — '+x.why : JSON.stringify(x))))}</li>`).join('');
  const roots = d.roots || {};
  const rootBlock = roots.available
    ? `<div class="roots"><b>词根拆解</b><br>${(roots.parts||[]).map(p=>`${esc(p.part)} = ${esc(p.meaning)}`).join(' + ')}<br><span class="m">${esc(roots.memory||'')}</span></div>`
    : `<div class="roots m">这个词没有可靠的词根可拆, 靠语境记。</div>`;
  // 注意: 这个函数**自己写 DOM、不返回 HTML**。生词本那条路径曾经写成
  // `$('#pBody').innerHTML = renderDef(r)`, 而 renderDef 返回 undefined,
  // 结果卡片刚画好就被 "undefined" 覆盖掉了(实测踩过)。要复用就别再套一层赋值。
  $(target || '#pBody').innerHTML = `
    <div class="field"><div class="label">在这句话里的意思</div><div class="val">${esc(d.sense_here||'')}</div></div>
    <div class="m">${esc(d.pos||'')} <span class="ipa">${esc(d.ipa||'')}</span>
      ${d.lemma&&d.lemma!==pendingWord.word? ' · 原形 '+esc(d.lemma):''}
      ${r.cached? ' · 缓存命中':''}</div>
    ${rootBlock}
    ${(d.other_senses||[]).length? `<div class="field"><div class="label">其他常见义</div><ul>${li(d.other_senses)}</ul></div>`:''}
    ${(d.related?.words||[]).length? `<div class="field"><div class="label">关联词</div><ul>${li(d.related.words)}</ul></div>`:''}
    ${(d.related?.sentences||[]).length? `<div class="field"><div class="label">关联句</div><ul>${li(d.related.sentences)}</ul></div>`:''}
    ${d.caution? `<div class="field m">注意: ${esc(d.caution)}</div>`:''}`;
}
// 已标生词要有明确反馈, 否则你不知道自己标过没有(实测踩过)
function syncMarkBtn(word){
  const marked = vocab.has(String(word).toLowerCase());
  const b = $('#pMark');
  b.textContent = marked ? '✓ 已在生词本' : '标记为生词';
  b.disabled = marked;
  b.style.opacity = marked ? '.6' : '1';
}
$('#pClose').onclick = () => $('#pop').close();
$('#pMark').onclick = async () => {
  if(!pendingWord) return;
  await api('/vocab', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({lemma: pendingWord.word, surface: pendingWord.word,
      sentence: pendingWord.sentence, episode_id: pendingWord.episode_id, seg_idx: pendingWord.seg_idx})});
  vocab.add(pendingWord.word.toLowerCase());
  $('#article').querySelectorAll(`.w[data-w="${CSS.escape(pendingWord.word)}"]`)
    .forEach(w => w.classList.add('marked'));

};

$('#back').onclick = () => showList(true);

// 历史管理: URL 里必须始终保留当前集(#<episode_id>), 否则刷新会丢掉正在读的内容。
// 之前 showList() 里写了 history.pushState({}, '', ' '), 会把 hash 抹掉 —— 实测踩过。
function showList(pushHistory){
  // 注意: 这里**不能**停音频。音频属于「正在播放的那一集」, 独立于「正在读的那一集」;
  // 返回列表就该继续放(这是常驻播放器的全部意义)。想停请点播放条上的 ✕。
  // 这行 pause() 是播放器还不存在时留下的, 会正好抵消掉常驻播放器 —— 实测踩过。
  $('#list').style.display='block'; $('#reader').style.display='none';
  $('#vocab').style.display='none';
  $('#back').style.display='none'; current=null; segments=[]; curIdx=-1;

  syncViewChrome();
  if(pushHistory) history.pushState({id:null}, '', location.pathname);
  loadList();
}

// ==================== 生词本 ====================
// 标过的词以前只有两个去处: 那一集正文里的高亮、和释义卡上的「✓ 已在生词本」。
// 没有一个地方能把它们**一起**看一遍 —— 等于只写不读的生词本。这一页就是那个地方。
//
// 三条规矩:
//   1. 按单集分组(而不是按时间): 同一集挑出来的词连着看, 语境能互相唤起;
//   2. 组内同一个词只出一条(标过两次就标个「×2」), 否则复习时满屏重复;
//   3. 只拉清单, 点开哪个词才去查那个词的释义 —— 清单本身不吃 API。

/** 头部控件跟着当前视图走: 导入框只在列表页有意义。 */
function syncViewChrome(){
  const inReader = getComputedStyle($('#reader')).display !== 'none';
  const inVocab = !inReader && getComputedStyle($('#vocab')).display !== 'none';
  const inList = !inReader && !inVocab;
  const n = $('#vocabCount');
  if(n){
    n.textContent = vocabState.total ? '· ' + vocabState.total : '';
    n.style.display = vocabState.total ? 'inline' : 'none';
  }
  document.body.dataset.view = inReader ? 'reader' : (inVocab ? 'vocab' : 'library');
  document.body.classList.toggle('reading', inReader);
  $('#homeHero').hidden = !inList;
  $('#listIntro').hidden = !inList;
  $('#vocabIntro').hidden = !inVocab;
  $('#back').style.display = inList ? 'none' : 'grid';
  const fullOpen = $('#full').classList.contains('on');
  $('#homeBtn').classList.toggle('active', !fullOpen && (inList || inReader));
  $('#vocabBtn').classList.toggle('active', !fullOpen && inVocab);
  $('#playerTab').classList.toggle('active', fullOpen);
  $('#viewTitle').textContent = inReader ? 'Reading' : (inVocab ? 'Vocabulary' : 'Library');
}

/** 离开正文时把"读到哪一句"的标记收掉, 免得回列表/生词本还留一条蓝线。 */
function clearReadingCursor(){
  document.querySelectorAll('.s.cursor').forEach(e => e.classList.remove('cursor'));
  curIdx = -1;
  lastScrolledIdx = -1;
}

function showVocab(pushHistory){
  $('#list').style.display='none'; $('#reader').style.display='none';
  $('#vocab').style.display='block';
  $('#back').style.display=''; current=null; segments=[];
  document.body.classList.remove('reading');
  clearReadingCursor();
  syncViewChrome();
  if(pushHistory !== false && location.hash !== '#vocab') history.pushState({}, '', '#vocab');
  // 每次都重新拉: 你刚在正文里标完词, 切过来就该看见它(读缓存会显得"没记住")
  $('#vocab').innerHTML = '<div class="empty">加载生词本…</div>';
  refreshVocab();
}

async function loadVocab(){
  try{
    const d = await api('/vocab/grouped');
    vocabState.groups = d.groups || [];
    // 单集号在分组上, 不在词条上。**必须就地把 episode_id 补进每一条**, 而不是只补
    // 拍平出来的那份副本 —— 渲染用的是 g.items, 拍平那份只给点击处理用; 两份不同步时
    // 症状是"判断条件里的字段是 undefined, 链接/跳转静默不出现"(实测踩过)。
    vocabState.groups.forEach(g => (g.items || []).forEach(it => {
      it.episode_id = g.episode_id;
      it.episode_title = g.episode_title;
    }));
    vocabState.items = vocabState.groups.flatMap(g => g.items || []);
    // 顺带把词表灌进 vocab 集合。直接从 /#vocab 进来(刷新/书签)时没走过 openEpisode,
    // 那时 vocab 是空的, 释义卡会把已经标过的词显示成「标记为生词」(实测踩过)。
    vocab = new Set(vocabState.items.map(it => String(it.lemma).toLowerCase()));
    vocabState.total = d.total||0;
    vocabState.raw = d.raw||0;
    vocabState.err = '';
  }catch(err){
    vocabState.groups = []; vocabState.items = []; vocabState.total = 0;
    vocabState.err = err.message;
  }
}

/** 把一条生词里的原句、那个词本身高亮出来(不然原句里全是黑字, 你还得自己找)。 */
function sentWithWord(sentence, surface){
  const s = String(sentence || '');
  if(!s) return '';
  const w = String(surface || '').trim();
  if(!w) return esc(s);
  const hit = new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\w*', 'i').exec(s);
  if(!hit) return esc(s);
  return esc(s.slice(0, hit.index)) +
    `<span class="vw">${esc(hit[0])}</span>` + esc(s.slice(hit.index + hit[0].length));
}

function fmtDay(ts){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(ts||''));
  return m ? `${+m[2]}/${+m[3]}` : '';
}

function vocabItemHtml(it){
  const meta = [
    fmtDay(it.created_at),
    it.explanation_key ? '已有释义' : '',
    it.count > 1 ? '×' + it.count : '',
  ].filter(Boolean).join(' · ');
  return `<li class="vitem" data-id="${it.id}">
    <div class="vmain" data-act="open">
      <div class="vw">${esc(it.lemma)}</div>
      <div class="vmeta">${meta}</div>
      ${it.sentence ? `<div class="vs">${sentWithWord(it.sentence, it.surface)}</div>` : ''}
      <div class="vd">点开看释义${it.seg_idx != null && it.episode_id ? ' · <span class="vj" data-act="jump">跳到原文这一句 →</span>' : ''}</div>
    </div>
    <button class="vx" data-act="del" title="从生词本移除">✕</button>
  </li>`;
}

function renderVocab(){
  const el = $('#vocab');
  if(vocabState.err){
    el.innerHTML = `<div class="empty">生词本打不开: ${esc(vocabState.err)}<br><br>`
      + `<button id="vRetry">重试</button></div>`;
    const r = $('#vRetry'); if(r) r.onclick = () => { $('#vocab').innerHTML = '<div class="empty">加载生词本…</div>'; refreshVocab() };
    return;
  }
  if(!vocabState.total){
    el.innerHTML = '<div class="empty">生词本还是空的。<br><br>'
      + '在正文里点一个单词, 释义卡上点「标记为生词」, 它就会出现在这里。</div>';
    syncViewChrome();
    $('#status').textContent = '生词本为空';
    return;
  }
  el.innerHTML = vocabState.groups.map(g => `
    <div class="vg">
      <div class="vg-h">
        <span class="vt">${esc(g.episode_title || '(未知单集)')}</span>
        <span class="vc">${g.items.length} 个词</span>
        ${g.episode_id ? `<button class="vgo" data-ep="${esc(g.episode_id)}">读这一集 →</button>` : ''}
      </div>
      <ul>${g.items.map(vocabItemHtml).join('')}</ul>
    </div>`).join('');
  bindVocab(el);
  syncViewChrome();
  $('#status').textContent = `${vocabState.total} 个生词`
    + (vocabState.raw > vocabState.total ? `(共标过 ${vocabState.raw} 次)` : '');
}

function bindVocab(el){
  el.querySelectorAll('.vitem').forEach(li => {
    const id = +li.dataset.id;
    const it = vocabState.items.find(x => x.id === id);
    if(!it) return;
    li.querySelector('[data-act="open"]').onclick = ev => {
      // 卡片里那个「跳到原文」的链接在 open 区的内部, 别把它也当成"点开看释义"
      if(ev.target.closest('[data-act="jump"]')) return;
      openVocabWord(it);
    };
    const j = li.querySelector('[data-act="jump"]');
    if(j) j.onclick = ev => { ev.stopPropagation(); jumpToWord(it) };
    li.querySelector('[data-act="del"]').onclick = async () => {
      // 先问一句: 删掉不可逆, 而且这个 ✕ 紧挨着"点开看释义", 很容易误触
      if(!confirm('从生词本移除「' + it.lemma + '」?')) return;
      try{
        await api('/vocab/' + id, {method:'DELETE'});
        vocab.delete(String(it.lemma).toLowerCase());
        await refreshVocab();
        $('#status').textContent = '已移除: ' + it.lemma;
      }catch(err){ $('#status').textContent = '移除失败: ' + err.message }
    };
  });
  el.querySelectorAll('.vgo').forEach(b => {
    b.onclick = () => { jumpSeg = null; openEpisode(b.dataset.ep, true) };
  });
}

/** 重新拉清单并重画(只在生词本视图里重画, 别把正文顶掉)。 */
async function refreshVocab(){
  await loadVocab();
  if($('#vocab').style.display !== 'none') renderVocab();
  else syncViewChrome();
}

/** 生词本里点开一个词: 复用释义卡, 句子用 seg_idx 现取(和标记时那句一致, 缓存才命中)。 */
async function openVocabWord(it){
  const ep = it.episode_id;
  let segs = ep ? segsCache.get(ep) : null;
  if(!segs && ep){
    try{
      const d = await api('/episodes/' + ep);
      segs = d.segments || [];
      segsCache.set(ep, segs);
    }catch{ segs = [] }
  }
  // 这一步纯粹为了拼出"当时那句话"。seg_idx 取不到就退回标记时存的那份句子。
  const sent = ((segs||[]).find(s => s.idx === it.seg_idx) || {}).text || it.sentence || '';

  $('#pWord').textContent = it.lemma;
  $('#pBody').innerHTML = '<div class="m">查询中…</div>';
  syncMarkBtn(it.lemma);
  if(!$('#pop').open) $('#pop').showModal();

  const prevWord = pendingWord;
  pendingWord = { word: it.surface || it.lemma, sentence: sent,
                  episode_id: ep, seg_idx: it.seg_idx, inVocab: true };

  try{
    const q = new URLSearchParams();
    if(ep) q.set('episode_id', ep);
    if(it.seg_idx != null) q.set('seg_idx', String(it.seg_idx));
    // renderDef 自己写 DOM(不返回 HTML), 所以这里只 await, 不要再套一层 innerHTML 赋值
    renderDef(await api('/vocab/' + encodeURIComponent(it.lemma) + '/explain?' + q.toString()));
  }catch(err){
    pendingWord = prevWord;
    $('#pBody').innerHTML = '<div class="m">查不到释义: ' + esc(err.message) + '</div>';
  }
}

$('#vocabBtn').onclick = () => showVocab(true);
$('#homeBtn').onclick = () => showList(true);
$('#brandHome').onclick = () => showList(true);
$('#playerTab').onclick = () => {
  if(playing.id) openFull();
  else $('#status').textContent = '还没有正在播放的单集';
};

/** 从生词本跳回原文: 打开那一集, 并停在当初标这个词的那一句上。
 *
 *  句子号只交给 jumpSeg, 由 openEpisode 在正文渲染完之后消费 —— 这里不能自己滚,
 *  此刻正文还没渲染出来(要滚的那个元素都还不存在)。
 */
function jumpToWord(it){
  if(!it.episode_id) return;
  jumpSeg = (it.seg_idx == null) ? null : it.seg_idx;
  openEpisode(it.episode_id, true);
}

// 字号也要持久化: 语速/连播/中译都记了, 唯独字号刷新后回到默认,
// 等于每次打开都要重新调一遍(实测踩过)。
function applyFontSize(px){
  document.documentElement.style.setProperty('--fs', px + 'px');
  const el = $('#fs'); if(el) el.value = px;
}
$('#fs').oninput = e => {
  applyFontSize(e.target.value);
  try{ localStorage.setItem('et.fs', String(e.target.value)) }catch(err){}
};
const savedFs = (() => { try{ return parseFloat(localStorage.getItem('et.fs')) }catch(e){ return NaN } })();
if(savedFs >= 15 && savedFs <= 26) applyFontSize(savedFs);

// ---------- 快捷键 ----------
// 空格 = 重听当前句 / 从当前句播放; [ ] = 上一句 / 下一句
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  if(!segments.length || curIdx < 0) return;
  if(e.code === 'Space'){ e.preventDefault(); playSeg(current.id, curIdx) }
  else if(e.key === ']'){ const n = segments.find(s => s.idx === curIdx + 1); if(n) playSeg(current.id, n.idx) }
  else if(e.key === '['){ const p = segments.find(s => s.idx === curIdx - 1); if(p) playSeg(current.id, p.idx) }
});

// ---------- 启动 ----------
applyRate();
syncAutoScroll();   // 让「定位」按钮一开始就反映真实状态(默认跟随)
// `.qa/engine.js` 靠这个把"刷新页面"重放一遍(脚本是整页脚本, 用例不能真的 reload)。
// 只读一下 localStorage 再刷按钮状态, 不改行为。
window.__etSyncAutoScroll = () => {
  autoScroll = localStorage.getItem('et.autoscroll') !== '0';
  syncAutoScroll();
};
(async () => {
  const h = location.hash.slice(1);
  // 列表永远要拉一次 —— 哪怕这次是直接进正文(从书签/分享链接进来)。
  // 否则从正文点「← 列表」会看到"还没有内容", 得手动刷新才出来(实测踩过)。
  const listPromise = loadList().catch(()=>{});
  // #vocab 是「生词本」这个视图的地址。刷新 / 从书签进来时得还原成生词本,
  // 不能被当成某个单集 id 去拉(那只会得到一句"打不开这一集")。
  if(h === 'vocab') showVocab(false);
  else if(h){ try{ await openEpisode(h, false) }catch{ showList(false) } }
  await listPromise;
  try{ const s = await api('/health'); if(!s.running && h !== 'vocab') $('#status').textContent='worker 未运行' }catch{}
})();
window.addEventListener('popstate', e => {
  const id = e.state?.id ?? location.hash.slice(1);
  if(id === 'vocab') showVocab(false);
  else if(id) openEpisode(id, false); else showList(false);
});
// 有些路径不会触发 popstate(直接在地址栏改 hash、或脚本里 pushState 改 hash),
// 但地址栏与屏幕内容必须始终一致 —— 否则刷新一次就跳回列表、或停在上一集。
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if(id === 'vocab'){ if($('#vocab').style.display === 'none') showVocab(false) }
  else if(id && (!current || current.id !== id)) openEpisode(id, false);
  else if(!id && current) showList(false);
});
</script>
